          description: 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierApplicationCardDto'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
