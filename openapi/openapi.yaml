openapi: 3.1.0
info:
  title: 마자용 B API (지원·채팅·합의·계약·알림·신고·문의)
  version: 0.7.0
  description: |
    B 담당 36개 operation. 성공은 {data} 또는 {data,meta}, 오류는
    {error:{code,message,requestId}}. 모든 경로는 Authorization Bearer가 필요하다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: application
  - name: market
  - name: chat
  - name: agreement
  - name: contract
  - name: notification
  - name: report
  - name: admin
  - name: support
