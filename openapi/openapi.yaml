          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/support/inquiries:
    get:
      operationId: listAdminInquiries
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/support/inquiries/{inquiryId}/answer:
    post:
      operationId: answerInquiry
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/inquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInquiry'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access-token
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    applicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string }
    contractId:
      name: contractId
      in: path
      required: true
      schema: { type: string }
    notificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string }
    messageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    reportId:
      name: reportId
      in: path
      required: true
      schema: { type: string }
    inquiryId:
      name: inquiryId
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50 }
    after:
      name: after
      in: query
      schema: { type: string, format: date-time }
    unreadOnly:
      name: unreadOnly
      in: query
      schema: { type: boolean }
    status:
      name: status
      in: query
      schema: { type: string }
  responses:
    Unauthenticated:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 권한 거부
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 없거나 비공개
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 상태 충돌·중복
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: 서버 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    DataEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    SubmitApplication:
      type: object
      additionalProperties: false
      required: [totalAmount, durationDays, items]
      properties:
        totalAmount: { type: integer, minimum: 1 }
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
        message: { type: [string, 'null'], maxLength: 4000 }
        questions:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: { type: string, minLength: 1, maxLength: 500 }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [specItemId, isAvailable]
            properties:
              specItemId: { type: string }
              isAvailable: { type: boolean }
    ReviseApplication:
      type: object
      additionalProperties: false
      required: [totalAmount, durationDays, items, revisionReason]
      properties:
        totalAmount: { type: integer, minimum: 1 }
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
        message: { type: [string, 'null'], maxLength: 4000 }
        questions:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: { type: string, minLength: 1, maxLength: 500 }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [specItemId, isAvailable]
            properties:
              specItemId: { type: string }
              isAvailable: { type: boolean }
        revisionReason: { type: string, minLength: 1, maxLength: 200 }
    SendMessage:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    SignContract:
      type: object
      additionalProperties: false
      required: [expectedContentHash]
      properties:
        expectedContentHash: { type: string, minLength: 1, maxLength: 128 }
    SubmitReport:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [CONTACT_OR_OFFSITE, ABUSE, FALSE_INFO, OTHER]
        detail: { type: [string, 'null'], maxLength: 2000 }
    ResolveReport:
      type: object
      additionalProperties: false
      required: [action, actionNote]
      properties:
        action:
          type: string
          enum: [NONE, WARNING, CHAT_RESTRICT_7D, SUSPEND]
        actionNote: { type: string, minLength: 1, maxLength: 2000 }
    CreateInquiry:
      type: object
      additionalProperties: false
      required: [category, title, body]
      properties:
        category:
          type: string
          enum: [USAGE, PAYMENT, INSPECTION, CANCEL, ACCOUNT, OTHER]
        contractId: { type: [string, 'null'], maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        attachments:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [url, name, size]
            properties:
              url: { type: string, minLength: 1, maxLength: 2048 }
              name: { type: string, minLength: 1, maxLength: 255 }
              size: { type: integer, minimum: 1, maximum: 10485760 }
    AnswerInquiry:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 5000 }
