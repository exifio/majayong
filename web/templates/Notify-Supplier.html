<helmet>
<style>
.pg{word-break:keep-all}
.nt sc-for,.nt sc-if{display:contents}
.pg{position:relative}
/* 뒤에 깔린 화면(지금 보던 화면) */
.bk{padding:40px 0 60px;opacity:.55}
.bk .sk{background:#fff;border:1px solid var(--s200);border-radius:12px}
.bk .ln{height:12px;border-radius:6px;background:var(--s200);margin:0 0 10px}
.bk .hero{height:240px;border-radius:14px;margin:18px 0}
.bk .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.bk .row4 .sk{height:110px}
.bk .list{height:300px;margin-top:24px}
.gnb .bell.open{background:var(--s100);border-radius:8px}
.gnb.dark .bell.open{background:rgba(255,255,255,.14)}
/* 드롭다운 */
.dd{position:absolute;top:66px;right:110px;width:440px;z-index:20;background:#fff;border:1px solid var(--s200);border-radius:14px;box-shadow:0 16px 40px rgba(11,37,69,.20)}
.dd::before{content:"";position:absolute;top:-7px;right:36px;width:12px;height:12px;background:#fff;border-left:1px solid var(--s200);border-top:1px solid var(--s200);transform:rotate(45deg)}
.dd .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
.dd .hd b{font-size:17px;font-weight:600}
.dd .hd b .n3{font-size:13px;font-weight:600;color:var(--blue-600,#2563EB);margin-left:6px}
.allread{font-family:inherit;font-size:13px;color:var(--s600);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.allread.off{color:var(--s400);text-decoration:none;cursor:default}
.seg3{display:flex;gap:6px;padding:0 18px 12px;border-bottom:1px solid var(--s200)}
.seg3 a{font-size:13px;padding:4px 11px;border-radius:14px;border:1px solid var(--s200);color:var(--s600);text-decoration:none}
.seg3 a.on{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.scr{max-height:520px;overflow:auto}
.day{font-size:12px;font-weight:600;color:var(--s600);margin:0;padding:10px 18px 4px;background:#fff}
.nr{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 18px;text-decoration:none;color:inherit;border-top:1px solid var(--s100)}
.nr.first{border-top:0}
.nr.un{background:#F5F9FF}
.nr .ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--s100);color:var(--s600);border:1px solid var(--s200)}
.nr .ic svg{width:16px;height:16px}
.nr .ic.blue{background:var(--blue-50,#EEF4FF);color:var(--blue-600,#2563EB);border-color:#D6E4FF}
.nr .ic.teal{background:#EAF6F4;color:var(--teal-700);border-color:#C7E6E0}
.nr .ic.amber{background:var(--amber-50);color:var(--amber-700);border-color:#F2E0BE}
.nr .msg{font-size:14px;color:var(--s900);line-height:1.5}
.nr.un .msg{font-weight:600}
.nr .sb{font-size:12px;color:var(--s600);margin-top:2px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.nr .tm{font-size:12px;color:var(--s600);white-space:nowrap}
.nr .ud{width:8px;height:8px;border-radius:50%;background:var(--blue-600,#2563EB)}
.foot{padding:12px 18px;border-top:1px solid var(--s200);background:var(--s50);border-radius:0 0 14px 14px}
.foot p{margin:0;font-size:12px;color:var(--s600);line-height:1.6}
.foot a{color:var(--s900)}
</style>
</helmet>

<div class="pg">

  <sc-if value="{{isClient}}" hint-placeholder-val="{{ true }}">
  <header class="gnb">
    <div class="wrap">
      <div class="gnbin">
        <a class="brand" href="Home-Client.dc.html"><span class="mark" aria-hidden="true"><i style="height:9px"></i><i style="height:17px"></i><i style="height:12px;opacity:.55"></i></span>마자용</a>
        <nav class="nav" aria-label="주요 메뉴">
          <a href="Home-Client.dc.html">홈</a><a href="Input-Client.dc.html">프로젝트 시작</a><a href="My-Client.dc.html">내 프로젝트</a><a href="Contracts-Supplier.dc.html">내 계약</a><a href="Settle-Supplier.dc.html">정산 내역</a>
        </nav>
        <div class="gright">
          <a class="bell dot" href="Chat-Client.dc.html" aria-label="채팅 — 새 메시지 1건"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></a>
          <a class="{{bellCls}}" href="Notify-Supplier.dc.html" aria-label="알림" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></a>
          <span class="who"><span class="ava">민</span><span class="uname">정민재</span></span>
        </div>
      </div>
    </div>
  </header>
  </sc-if>
  <sc-if value="{{isSupplier}}" hint-placeholder-val="{{ false }}">
  <header class="gnb dark">
    <div class="wrap">
      <div class="gnbin">
        <a class="brand" href="Home-Supplier.dc.html"><span class="mark" aria-hidden="true"><i style="height:9px"></i><i style="height:17px"></i><i style="height:12px;opacity:.55"></i></span>마자용</a>
        <nav class="nav" aria-label="주요 메뉴">
          <a href="Home-Supplier.dc.html">홈</a><a href="Find-Supplier.dc.html">프로젝트 찾기</a><a href="Apps-Supplier.dc.html">내 지원</a><a href="Contracts-Supplier.dc.html">내 계약</a><a href="Find-Supplier.dc.html">북마크</a>
        </nav>
        <div class="gright">
          <a class="bell dot" href="Chat-Supplier.dc.html" aria-label="채팅 — 새 메시지 1건"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></a>
          <a class="{{bellCls}}" href="Notify-Supplier.dc.html" aria-label="알림" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></a>
          <span class="who"><span class="ava">최</span><span class="uname">최준호</span></span>
        </div>
      </div>
    </div>
  </header>
  </sc-if>

  <main class="nt">
    <div class="bk" aria-hidden="true">
      <div class="wrap">
        <div class="ln" style="width:260px;height:22px"></div>
        <div class="ln" style="width:360px"></div>
        <div class="sk hero"></div>
        <div class="row4"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
        <div class="sk list"></div>
      </div>
    </div>

    <section class="dd" role="dialog" aria-label="알림">
      <div class="hd">
        <b>알림<sc-if value="{{hasUn}}" hint-placeholder-val="{{ true }}"><span class="n3">{{nUn}}</span></sc-if></b>
        <button type="button" class="{{allCls}}" data-action-href="?view=모두+읽음">모두 읽음</button>
      </div>
      <nav class="seg3" aria-label="알림 보기"><a class="on" href="#all">전체 {{nAll}}</a><a href="#unread">안 읽음 {{nUn}}</a></nav>
      <div class="scr">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <p class="day">{{g.label}}</p>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
            <a class="{{r.cls}}" href="{{r.href}}" title="{{r.go}}(으)로 이동">
              <span class="{{r.icCls}}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
              <span>
                <span class="msg" style="display:block">{{r.msg}}</span>
                <span class="sb" style="display:block">{{r.sub}}</span>
              </span>
              <span class="rt">
                <span class="tm">{{r.time}}</span>
                <sc-if value="{{r.un}}" hint-placeholder-val="{{ true }}"><span class="ud" role="img" aria-label="안 읽음"></span></sc-if>
              </span>
            </a>
          </sc-for>
        </sc-for>
      </div>
      <div class="foot">
        <p>최근 30일 알림입니다. 예치 · 납품 · 검수 · 지급 소식은 <a href="Contracts-Supplier.dc.html">내 계약</a>에서 상태로 보여 드리고, 알림으로는 기한 안내만 보냅니다.</p>
      </div>
    </section>
  </main>

</div>
